name: EPSampleTool
options:
  bundleIdPrefix: com.vmironov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 86384FBV8M
    CODE_SIGN_STYLE: Automatic
targets:
  EPSampleTool:
    type: application
    platform: iOS
    sources:
      - EPSampleTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vmironov.EPSampleTool
        INFOPLIST_KEY_CFBundleDisplayName: EP Samples
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
  EPSampleToolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EPSampleToolTests
    dependencies:
      - target: EPSampleTool
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vmironov.EPSampleToolTests
schemes:
  EPSampleTool:
    build:
      targets:
        EPSampleTool: all
        EPSampleToolTests: [test]
    test:
      targets:
        - EPSampleToolTests
